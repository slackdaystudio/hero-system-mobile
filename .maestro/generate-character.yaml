# Generate a random character end-to-end and view its full sheet — with NO file
# picker, so it runs unattended in CI. This is the flow that actually exercises the
# rules engine through the UI: Generate builds a ParsedCharacter, prices it with the
# same engine that reads a real .hdc, and renders the sheet we screenshot here.
#
# Uses 6E Standard (400 pts). The 3s animated "deal" is handled with extendedWaitUntil
# rather than a fixed sleep.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
# Wait for Home to finish loading before tapping — the E2E seed lengthens cold startup.
- extendedWaitUntil:
    visible:
        id: 'tile-All Characters'
    timeout: 90000

# Home -> Characters -> Generate (both header actions live on CharacterList)
- tapOn:
    id: 'tile-All Characters'
- tapOn:
    id: 'generate-character'
- assertVisible: 'Random Character'

# Pick the 6E edition and deal a hand of five
- tapOn:
    id: 'segment-6e-standard'
- tapOn:
    id: 'generate-confirm' # "Generate"

# The deal animates for ~3s; wait for the hand instead of sleeping.
- extendedWaitUntil:
    visible:
        id: 'candidate-0'
    timeout: 20000
- takeScreenshot: 'maestro-artifacts/${PLATFORM}/10-generate-hand'

# Keep the first candidate and open it
- tapOn:
    id: 'candidate-0'
- tapOn:
    id: 'generate-confirm' # "View"

# A generated character opens on CharacterDetail with its recipe EDITOR on top and
# the priced sheet (SheetTabs) BELOW it in the same scroll view. First confirm the
# editor rendered, then scroll the sheet's tab control into view — SheetTabs only
# renders once the engine has built the sheet, so reaching it proves pricing worked.
- assertVisible:
    id: 'edit-name'
- scrollUntilVisible:
    element:
        id: 'segment-character'
    direction: DOWN
- takeScreenshot: 'maestro-artifacts/${PLATFORM}/11-sheet-character'

# Combat tab (same control row, now on screen)
- tapOn:
    id: 'segment-combat'
- takeScreenshot: 'maestro-artifacts/${PLATFORM}/12-sheet-combat'
