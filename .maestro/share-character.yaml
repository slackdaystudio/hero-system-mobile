# Sharing a character (#71, docs/SHARING.md): Share opens the system share sheet, and on
# iOS the file survives a round trip through Files and back in through Import.
#
# Why this flow exists: sharing is the first feature to add a native module since the
# rebuild (react-native-share), and nobody on the project has an Apple device. A missing
# pod or a native crash shows up here as "Share failed", or as the app gone from the
# screen, before it reaches TestFlight.
#
# The share sheet and the Files picker are system UI, drawn outside the app. CI has shown
# Maestro can drive both on the simulator (PR #86): the sheet, Save to Files, and picking
# the saved file back up in Import. "On My iPhone" stays optional because where Browse
# lands depends on what the picker last showed. Every step leaves a screenshot under
# maestro-artifacts/<platform>/share-*.
#
# The E2E seed's character is named Defensor (its id is sample-hero), so the file is
# Defensor.hsm.
appId: ${APP_ID}
---
- launchApp:
    clearState: true # empties the store -> the E2E build reseeds Sample Hero
- extendedWaitUntil:
    visible:
        id: 'tile-All Characters'
    timeout: 90000
- tapOn:
    id: 'tile-All Characters'
- tapOn:
    id: 'character-sample-hero'
- assertVisible:
    id: 'segment-character'

- tapOn:
    id: 'share-character'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-1-sheet'
# The one failure the app itself reports. Packing the file, the native module and the
# share sheet's launch all fail into this alert.
- assertNotVisible: 'Share failed'

- runFlow:
    when:
        platform: iOS
    commands:
        - extendedWaitUntil:
              visible: 'Save to Files'
              timeout: 20000
        - tapOn: 'Save to Files'
        - waitForAnimationToEnd:
              timeout: 5000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-2-files'
        - tapOn: 'Save'
        - waitForAnimationToEnd:
              timeout: 5000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-3-saved'

        # Back in through Import, from a cold start so nothing is left over from the sheet.
        - stopApp
        - launchApp
        - extendedWaitUntil:
              visible:
                  id: 'tile-All Characters'
              timeout: 90000
        - tapOn:
              id: 'tile-All Characters'
        - tapOn: 'Import'
        - waitForAnimationToEnd:
              timeout: 5000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-4-picker'
        - tapOn: 'Browse'
        - tapOn:
              text: 'On My iPhone'
              optional: true
        - waitForAnimationToEnd:
              timeout: 5000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-5-browse'
        - tapOn: 'Defensor.hsm'
        - waitForAnimationToEnd:
              timeout: 5000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-6-picked'
        # Defensor is already on the phone, so a working import asks how to land it.
        - extendedWaitUntil:
              visible: 'Import as copy'
              timeout: 20000
        - tapOn: 'Import as copy'
        # A copy lands as "Defensor (2)" and opens its sheet.
        - extendedWaitUntil:
              visible: 'Defensor \(2\)'
              timeout: 20000
        - takeScreenshot: 'maestro-artifacts/${PLATFORM}/share-7-imported'

# Android: the chooser was device-tested; here it only has to open without the app
# reporting a failure. Back dismisses it.
- runFlow:
    when:
        platform: Android
    commands:
        - back
        - assertVisible:
              id: 'segment-character'
