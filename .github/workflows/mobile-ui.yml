name: Mobile UI (E2E)

# Cross-platform end-to-end UI tests: the SAME Maestro flows (.maestro/) run on a
# real iOS Simulator and a real Android emulator, then upload their screenshots so a
# human can eyeball how each platform renders. See docs/UI_TESTING.md.
#
# Design notes that make this reliable:
#   * Both platforms build a STANDALONE app with the JS bundle embedded
#     (iOS Release / Android assembleRelease) — no Metro server to race against.
#   * No signing secrets: the iOS simulator needs none, and android/app/build.gradle
#     falls back to the committed debug keystore when release props are absent.
#   * macOS runners are free for public repos, which is what makes iOS CI viable here.
#   * The build flips e2eSeed.ts to true so a fixed Sample Hero exists for the
#     visual-regression flow; the status bar is frozen so the clock can't cause diffs.

on:
    pull_request:
    push:
        branches: [rebuild]
    workflow_dispatch:

# One in-flight run per branch; a new push cancels the previous run.
concurrency:
    group: mobile-ui-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ios:
        name: iOS · Maestro
        runs-on: macos-15 # Xcode 16 default: the pods request Swift 6.0 (macos-14/Xcode 15 tops out at 5.0)
        timeout-minutes: 45
        env:
            SCHEME: herogmtools
            DERIVED: ios/build
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # Compile the deterministic Sample Hero seed into this (Release) build only.
            # Production keeps the committed `false`; this never reaches the store.
            - name: Enable the E2E seed
              run: echo 'export const E2E_SEED = true;' > src/app/composition/e2eSeed.ts

            # CocoaPods via Bundler; installs pods and generates the .xcworkspace.
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.3' # no .ruby-version in repo; pin explicitly
                  bundler-cache: true

            - name: Pod install
              run: bundle exec pod install --project-directory=ios

            # Release config embeds the JS bundle -> the app runs without Metro.
            # Simulator builds need no code signing.
            - name: Build app for the simulator
              run: |
                  set -o pipefail
                  xcodebuild \
                    -workspace ios/${SCHEME}.xcworkspace \
                    -scheme ${SCHEME} \
                    -configuration Release \
                    -sdk iphonesimulator \
                    -derivedDataPath ${DERIVED} \
                    -destination 'generic/platform=iOS Simulator' \
                    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
                    build

            - name: Boot a simulator
              run: |
                  UDID=$(xcrun simctl list devices available \
                    | grep -Eo 'iPhone 1[0-9][^(]*\(([0-9A-F-]{36})\)' \
                    | grep -Eo '[0-9A-F-]{36}' | head -1)
                  echo "Booting $UDID"
                  xcrun simctl boot "$UDID"
                  xcrun simctl bootstatus "$UDID" -b

            # Freeze the status bar so the clock/battery can't cause visual diffs.
            - name: Freeze the status bar
              run: |
                  xcrun simctl status_bar booted override \
                    --time "9:41" \
                    --dataNetwork wifi --wifiMode active --wifiBars 3 \
                    --cellularMode active --cellularBars 4 \
                    --batteryState charged --batteryLevel 100

            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            - name: Install app on the simulator
              run: |
                  APP=$(find ${DERIVED}/Build/Products/Release-iphonesimulator -name '*.app' -maxdepth 1 | head -1)
                  echo "Installing $APP"
                  xcrun simctl install booted "$APP"

            - name: Run Maestro flows
              run: bash scripts/e2e-run.sh ios org.diceless.herogmtools

            # Pixel-diff the character sheet against its committed iOS baseline.
            # CROP_TOP excludes the status bar (chrome, flickers even with the clock frozen);
            # CROP_BOTTOM excludes the half-cut-off power row at the frame edge, whose clipped
            # pixels jitter run-to-run (not user-visible — a real user scrolls to see it).
            - name: Visual regression — character sheet
              if: always()
              env:
                  CROP_TOP: '160'
                  CROP_BOTTOM: '120'
              run: node scripts/pixel-diff.js maestro-artifacts/ios/sheet.png .maestro/baselines/ios/sheet.png maestro-artifacts/ios/sheet.diff.png

            - name: Upload screenshots & report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: maestro-ios
                  path: |
                      maestro-artifacts/**
                      maestro-report-ios.xml
                  if-no-files-found: warn

    android:
        name: Android · Maestro
        runs-on: ubuntu-latest # KVM-accelerated emulator via the action below
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # Compile the deterministic Sample Hero seed into this build only.
            - name: Enable the E2E seed
              run: echo 'export const E2E_SEED = true;' > src/app/composition/e2eSeed.ts

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Gradle cache
              uses: gradle/actions/setup-gradle@v4

            # assembleRelease bundles the JS and self-signs with the committed
            # debug keystore (no release props in CI) -> standalone, no Metro.
            - name: Build release APK
              run: ./gradlew assembleRelease
              working-directory: android

            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            # KVM permissions for a fast hardware-accelerated emulator.
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                    | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run Maestro flows on an emulator
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34 # solid google_apis image; bump toward 35 (the app's target) when stable on CI
                  arch: x86_64
                  profile: pixel_6
                  script: |
                      adb install -r android/app/build/outputs/apk/release/app-release.apk
                      # Freeze the status bar (demo mode) so the clock can't cause visual diffs.
                      adb shell settings put global sysui_demo_allowed 1
                      adb shell am broadcast -a com.android.systemui.demo -e command enter
                      adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
                      adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
                      adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4
                      adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
                      bash scripts/e2e-run.sh android com.herogmtools

            # Pixel-diff the character sheet against its committed Android baseline.
            # CROP_TOP excludes the status bar; CROP_BOTTOM excludes the nav bar and the
            # frame-edge power row (see iOS note) — precautionary, this region already matched.
            - name: Visual regression — character sheet
              if: always()
              env:
                  CROP_TOP: '140'
                  CROP_BOTTOM: '130'
              run: node scripts/pixel-diff.js maestro-artifacts/android/sheet.png .maestro/baselines/android/sheet.png maestro-artifacts/android/sheet.diff.png

            - name: Upload screenshots & report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: maestro-android
                  path: |
                      maestro-artifacts/**
                      maestro-report-android.xml
                  if-no-files-found: warn
